name: Container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "containers/Dockerfile"
      - "envs/**"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build experimental image
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tasnimul-arabi-anik/panresistome
          tags: |
            type=raw,value=experimental,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: |
          set -euo pipefail
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          docker run --rm "${IMAGE}" bash -lc '
            set -euo pipefail
            for tool in \
              abricate \
              mlst \
              integron_finder \
              mefinder \
              fetchm2 \
              fetchM \
              seqkit \
              amrfinder \
              checkm2 \
              fastANI \
              skani \
              quast.py \
              mash \
              mob_recon \
              genomad \
              kleborate \
              kaptive \
              ectyper \
              panr; do
              command -v "${tool}"
            done
            mefinder --help >/dev/null
            genomad --version
            mob_recon --version
            ectyper --version
            /opt/conda/envs/checkm2_env/bin/python -c "from checkm2 import modelProcessing; modelProcessing.modelProcessor(1); print(\"checkm2_model_load=PASS\")"
            panr --version
          '

      - name: Print image tags
        run: echo "${{ steps.meta.outputs.tags }}"

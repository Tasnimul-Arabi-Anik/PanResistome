name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    name: Syntax and Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Check bootstrap script syntax
        run: bash -n scripts/bootstrap.sh

      - name: Check Nextflow help path
        run: nextflow run main.nf --help --run_gtdbtk false --stop_after_qc true

      - name: Check pipeline version consistency
        run: |
          version="$(cat VERSION)"
          grep -q "params.pipeline_version = '${version}'" main.nf
          grep -q "Current pipeline version: \`${version}\`" README.md

      - name: Run offline fixture profile
        run: nextflow run main.nf -profile test

      - name: Check offline fixture outputs
        run: |
          test -s test_output/Klebsiella_oxytoca/metadata_output/ncbi_enriched.csv
          test -s test_output/Klebsiella_oxytoca/metadata_output/ncbi_clean_qc_pass.csv
          test -s test_output/Klebsiella_oxytoca/sequence_qc/qc_decisions.tsv
          grep -q "sequence_qc_status" test_output/Klebsiella_oxytoca/metadata_output/ncbi_enriched.csv
          pass_count="$(tail -n +2 test_output/Klebsiella_oxytoca/sequence_qc/qc_decisions.tsv | awk -F'\t' '$2 == "PASS" { count++ } END { print count + 0 }')"
          test "$pass_count" -eq 2
